<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIBIMBAP 친구들 — 지휘자가 직접 푸는 이야기</title>
<style>
:root{--bg:#FFFDF5;--card:#FFFFFF;--surface:#F5F0E8;--yellow:#FFD43B;--pink:#FF6B9D;--blue:#4DABF7;--coral:#FF6B35;--mint:#63E6BE;--lav:#B197FC;--lime:#A9E34B;--orange:#FF922B;--ink:#1A1A1A;--body:#374151;--bw:3px;--sh:6px 6px 0 var(--ink);--sh-sm:4px 4px 0 var(--ink);--r:22px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:-apple-system,system-ui,"Apple SD Gothic Neo",Pretendard,"Segoe UI","Noto Sans KR",sans-serif;font-size:20px;line-height:1.45;overflow-x:hidden}
button{font:inherit;color:inherit}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:14px 24px;background:var(--yellow);border-bottom:var(--bw) solid var(--ink)}
.logo{background:var(--ink);color:var(--yellow);font-weight:900;font-size:18px;letter-spacing:.1em;padding:6px 12px;border-radius:10px;border:var(--bw) solid var(--ink);transform:rotate(-3deg)}
h1{margin:0;font-size:34px;font-weight:900;line-height:1.1}
.sub{margin:0;font-size:18px;font-weight:700;color:var(--body);flex:1 1 200px}
.hdr-r{display:flex;gap:10px;flex-wrap:wrap}
main{max-width:1240px;margin:0 auto;padding:20px 20px 40px}
.btn{min-height:52px;font-size:22px;font-weight:900;border:var(--bw) solid var(--ink);border-radius:16px;background:var(--card);box-shadow:var(--sh);padding:8px 22px;cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:hover{background:var(--surface)}
.btn:active,.btn[aria-pressed="true"]{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
.btn[aria-pressed="true"]{background:var(--lime)}
.btn.big{background:var(--pink);color:#fff;min-width:150px}
.btn.play{background:var(--blue);color:#fff}
.btn:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
.scene{background:var(--card);border:var(--bw) solid var(--ink);border-radius:var(--r);box-shadow:var(--sh);padding:20px 24px;min-height:520px;display:flex;flex-direction:column;gap:16px;overflow:hidden}
.scene h2{font-size:38px;margin:0;line-height:1.15;font-weight:900}
.scene h2 .tag{display:inline-block;background:var(--ink);color:var(--yellow);font-size:18px;padding:2px 12px;border-radius:10px;vertical-align:middle;margin-right:10px;transform:rotate(-2deg)}
.row{display:grid;grid-template-columns:1fr 370px;gap:20px;align-items:stretch;flex:1}.row>*{min-width:0}
.stage{position:relative;background:var(--surface);border:var(--bw) solid var(--ink);border-radius:18px;padding:48px 8px 10px;display:flex;gap:10px;justify-content:center;align-items:flex-end;flex-wrap:wrap;min-height:320px}
.panel{background:var(--card);border:var(--bw) solid var(--ink);border-radius:18px;padding:16px;box-shadow:var(--sh-sm);display:flex;flex-direction:column;gap:10px;justify-content:center}
.cap{font-size:22px;font-weight:800;background:var(--yellow);border:var(--bw) solid var(--ink);border-radius:14px;padding:10px 18px;box-shadow:var(--sh-sm)}
.cap.mint{background:var(--mint)}.cap.lav{background:var(--lav)}.cap.lime{background:var(--lime)}.cap.coral{background:var(--coral);color:#fff}
.kid{font-size:20px;line-height:1.5;margin:0}
.kid.small{font-size:18px;color:var(--body)}
.kid b{background:linear-gradient(transparent 60%,var(--yellow) 60%)}
/* ── characters ── */
.ch{width:132px;position:relative;text-align:center;transition:opacity .5s,filter .5s,width .4s;flex:0 0 auto}
.ch svg{width:100%;height:auto;display:block;overflow:visible}
.ch .nm{font-weight:900;font-size:18px;background:var(--card);border:var(--bw) solid var(--ink);border-radius:12px;padding:2px 8px;display:inline-block;box-shadow:3px 3px 0 var(--ink);margin-top:4px;line-height:1.2;white-space:nowrap}
.ch .nm .short{display:none}.ch.small .nm .full,.ch.ghost .nm .full{display:none}.ch.small .nm .short,.ch.ghost .nm .short{display:inline}
.ch .sub2{font-size:18px;color:var(--body);font-weight:700;margin-top:4px}
.ch.small{width:104px}.ch.small .nm{font-size:18px;padding:1px 8px}
.ch.big{width:230px}.ch.big .nm{font-size:22px}
.ch.tiny{width:84px}.ch.tiny .nm{font-size:18px;padding:1px 6px}.ch.tiny .nm .full{display:none}.ch.tiny .nm .short{display:inline}.ch.tiny .sub2{font-size:18px}.stage.tight{gap:6px}
.ch.dim{opacity:.35;filter:grayscale(.8)}
.ch.ghost{opacity:.6}
.ch .say{position:absolute;left:50%;top:-40px;transform:translate(-50%,8px);background:#fff;border:var(--bw) solid var(--ink);border-radius:14px;padding:4px 12px;font-size:18px;font-weight:800;white-space:nowrap;opacity:0;transition:.3s;pointer-events:none;z-index:3;box-shadow:3px 3px 0 var(--ink)}
.ch .say.on{opacity:1;transform:translate(-50%,0)}
.ch .body{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
.ch .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.ch:nth-child(2n) .eyes{animation-delay:1.3s}.ch:nth-child(3n) .body{animation-delay:.8s}
.ch .bubble,.ch .check,.ch .abox{opacity:0;transition:opacity .3s}
.ch.working .bubble{opacity:1}
.ch.working .dots circle{transform-box:fill-box;transform-origin:center;animation:dot .9s ease-in-out infinite}
.ch.working .dots circle:nth-child(2){animation-delay:.15s}.ch.working .dots circle:nth-child(3){animation-delay:.3s}
.ch .baton,.ch .wand,.ch .hammer,.ch .sheet,.ch .laptop{transform-box:fill-box;transform-origin:0% 100%;transition:transform .6s}
.ch.working .baton,.ch.working .wand,.ch.working .sheet{animation:wave 1s ease-in-out infinite}
.ch.working .hammer{animation:hit .45s ease-in-out infinite}
.ch.working .laptop{animation:type .22s steps(2) infinite}
.ch.working .lamp{animation:lamp .6s steps(2) infinite}
.ch.point .baton{transform:rotate(40deg)}
.ch.done .check{opacity:1;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.ch.done svg{animation:hop .55s ease-out 3}
.ch.answer .abox{opacity:1}.ch.answer .wand{opacity:0}
.ch.bump svg{animation:bump var(--d,1.3s) ease-in-out infinite alternate}
@keyframes breathe{50%{transform:scaleY(1.035) scaleX(.99)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes dot{50%{transform:translateY(-7px)}}
@keyframes wave{50%{transform:rotate(-22deg)}}
@keyframes hit{50%{transform:rotate(-35deg)}}
@keyframes type{50%{transform:translateY(3px)}}
@keyframes lamp{50%{fill:#FFD43B}}
@keyframes hop{40%{transform:translateY(-24px)}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}}
@keyframes bump{0%{transform:translate(0,0) rotate(-5deg)}100%{transform:translate(var(--x,18px),-10px) rotate(6deg)}}
/* ── props ── */
.note{position:absolute;z-index:5;background:#fff;border:var(--bw) solid var(--ink);border-radius:12px;padding:6px 12px;font-size:18px;font-weight:800;line-height:1.25;box-shadow:var(--sh-sm);transform:translate(-50%,-50%) rotate(-6deg);transition:left 1.2s cubic-bezier(.4,0,.2,1),top 1.2s cubic-bezier(.4,0,.2,1),opacity .3s;opacity:0;white-space:nowrap}
.note.on{opacity:1}
.bowl{width:100%;max-width:250px;margin:0 auto;display:block;overflow:visible}
.pcard{transform:translateY(-130px);opacity:0;transition:transform 1s cubic-bezier(.2,1.4,.4,1),opacity .4s}
.pcard.in{transform:none;opacity:1}
.bowlcheck{opacity:0;transform-box:fill-box;transform-origin:center}
.bowlcheck.on{opacity:1;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tl li{display:flex;gap:10px;align-items:flex-start;font-size:18px;opacity:.35;transition:opacity .4s}
.tl li.on{opacity:1}
.tl .t{flex:0 0 auto;background:var(--ink);color:#fff;font-weight:900;border-radius:10px;padding:1px 10px;font-variant-numeric:tabular-nums}
.energy .elbl,.cmp .elbl{font-weight:900;font-size:18px}
.track{display:flex;height:44px;border:var(--bw) solid var(--ink);border-radius:12px;overflow:hidden;background:var(--surface)}
.fill{height:100%;width:0;transition:width 1.8s cubic-bezier(.3,0,.2,1)}
.fill.in{background:var(--blue)}.fill.out{background:var(--coral)}
.legend{font-size:18px;font-weight:700;line-height:1.6}
.sw{display:inline-block;width:16px;height:16px;border:2px solid var(--ink);border-radius:4px;vertical-align:-2px;margin:0 2px 0 4px}
.sw.in{background:var(--blue)}.sw.out{background:var(--coral)}
.clockrow{display:flex;gap:14px;align-items:center;font-size:18px;font-weight:700}
.clock{width:84px;flex:0 0 auto}
#hand{transform-origin:50px 50px;transition:transform 1.8s cubic-bezier(.3,0,.2,1)}
.calls{display:flex;flex-direction:column;gap:6px;font-size:18px;font-weight:700}
.calls div{border:2px solid var(--ink);border-radius:10px;padding:4px 10px;background:var(--surface);opacity:0;transform:translateX(14px);transition:.4s}
.calls div.on{opacity:1;transform:none}
.cmp{display:flex;flex-direction:column;gap:10px}
.cmprow{display:grid;grid-template-columns:112px 1fr;gap:8px;align-items:center;font-size:18px;line-height:1.2;font-weight:800}
.cmprow small{font-size:18px;color:var(--body)}
.blocks{display:flex;flex-wrap:wrap;gap:5px 3px;min-height:30px;min-width:0;align-items:center;position:relative;padding-right:10px}
.blk{width:22px;height:30px;border:var(--bw) solid var(--ink);border-radius:6px;flex:0 0 auto;transform:scale(0);transition:transform .25s cubic-bezier(.2,1.6,.4,1)}
.blk.on{transform:none}
.blk.spill{transform:scale(0) rotate(0)}.blk.spill.on{transform:rotate(var(--rot,8deg)) translateY(var(--dy,0))}
.cmprow .num{display:block;font-size:21px;line-height:1.1;font-variant-numeric:tabular-nums}
.burst{position:absolute;right:-6px;top:-30px;z-index:2;background:var(--coral);color:#fff;border:var(--bw) solid var(--ink);border-radius:10px;padding:2px 10px;font-size:18px;transform:rotate(6deg) scale(0);transition:transform .4s cubic-bezier(.2,1.6,.4,1)}
.burst.on{transform:rotate(6deg) scale(1)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0;padding:0;list-style:none}
.stats li{border:var(--bw) solid var(--ink);border-radius:12px;padding:4px 10px;font-size:18px;font-weight:800;background:var(--surface)}
.stats li b{display:block;font-size:24px;line-height:1.15}.stats li b small{font-size:18px;color:var(--body)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;flex:1;align-content:center}
.card3{border:var(--bw) solid var(--ink);border-radius:var(--r);padding:22px;box-shadow:var(--sh);transform:scale(.85);opacity:0;transition:.5s cubic-bezier(.2,1.4,.4,1);display:flex;flex-direction:column;gap:10px}
.card3.on{transform:none;opacity:1}
.card3 h3{margin:0;font-size:34px;line-height:1.1}
.card3 .ico{width:90px;height:90px}
.card3 p{margin:0;font-size:19px;font-weight:700}
.card3 .n{font-size:28px;font-weight:900}
.pulse{animation:pop .4s cubic-bezier(.2,1.6,.4,1)}
.cap.pulse{animation:capin .45s cubic-bezier(.2,1,.3,1)}
@keyframes capin{from{transform:translateY(10px);opacity:.2}}
/* ── 실전 재생 (live replay) ── */
.lbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:var(--bw) solid var(--ink);border-radius:14px;overflow:hidden;box-shadow:var(--sh-sm);background:var(--card)}
.seg button{min-height:48px;min-width:58px;border:0;border-right:var(--bw) solid var(--ink);background:var(--card);font-weight:900;font-size:19px;cursor:pointer}
.seg button:last-child{border-right:0}.seg button[aria-pressed="true"]{background:var(--ink);color:var(--yellow)}
.btn.loop{font-size:18px;min-height:48px;padding:6px 14px}
.lclock{display:flex;align-items:center;gap:8px;font-weight:900;font-size:24px;font-variant-numeric:tabular-nums}
.lclock .clock{width:46px}
#lhand{transform-origin:50px 50px;transition:transform .2s linear}
.pdots{display:flex;gap:8px;margin-left:auto}
.pdots span{width:24px;height:24px;border-radius:50%;border:var(--bw) solid var(--ink);background:var(--card);transition:background .4s}
.pdots span.cur{background:var(--yellow)}.pdots span.ok{background:#51CF66}
.pcwrap{overflow:hidden;padding:2px 6px 8px 2px;margin:-2px -6px -8px -2px}
.pc{background:#fff;border:var(--bw) solid var(--ink);border-radius:14px;padding:8px 14px;box-shadow:var(--sh-sm);display:flex;align-items:center;gap:10px;flex-wrap:wrap;transform:translateX(130%);opacity:0;transition:transform .7s cubic-bezier(.2,1.2,.3,1),opacity .4s}
.pc.in{transform:none;opacity:1}.pc.out{transform:translateX(-130%);opacity:0;transition:transform .6s cubic-bezier(.6,0,.4,1),opacity .4s}
.badge{background:var(--ink);color:var(--yellow);font-weight:900;border-radius:10px;padding:2px 10px;font-size:18px}
.pc b{font-size:21px}.pc small{font-size:18px;color:var(--body);font-family:ui-monospace,Menlo,monospace}
.row.live .bowl{max-width:150px}
.acard{position:absolute;z-index:6;background:#fff;border:var(--bw) solid var(--ink);border-radius:14px;padding:6px 14px;font-size:24px;font-weight:900;box-shadow:var(--sh-sm);transform:translate(-50%,-50%) scale(0);transition:transform .45s cubic-bezier(.2,1.6,.4,1)}
.acard.on{transform:translate(-50%,-50%) rotate(-6deg)}
.gap{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:4;background:var(--lav);border:var(--bw) solid var(--ink);border-radius:12px;padding:4px 12px;font-weight:900;font-size:18px;white-space:nowrap;opacity:0;transition:opacity .3s}
.gap.on{opacity:1}
.note.curve{left:0;top:0;transform:rotate(-6deg);offset-rotate:0deg;offset-distance:0%;transition:offset-distance 1.2s cubic-bezier(.4,0,.2,1),opacity .3s}
.pill{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:1px 10px;display:inline-block;font-size:18px;font-weight:800}.live-cap .pill{font-size:inherit}.pc .pill{background:var(--lav)}
/* ── nav ── */
.nav{display:flex;gap:14px;justify-content:center;align-items:center;margin:18px 0 6px;flex-wrap:wrap}
.dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.dots button{width:48px;height:48px;border-radius:50%;border:var(--bw) solid var(--ink);background:var(--card);font-weight:900;font-size:18px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.dots button[aria-current="true"]{background:var(--ink);color:var(--yellow);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.hint{text-align:center;color:var(--body);font-size:18px;font-weight:700;margin:0}
/* ── intro dialog ── */
dialog{border:var(--bw) solid var(--ink);border-radius:var(--r);box-shadow:10px 10px 0 var(--ink);padding:0;width:min(960px,94vw);max-height:92vh;background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(26,26,26,.55)}
.dhead{display:flex;align-items:center;gap:12px;padding:14px 20px;background:var(--lav);border-bottom:var(--bw) solid var(--ink)}
.dhead h2{margin:0;font-size:28px;flex:1}
.tabs{display:flex;gap:8px;padding:14px 20px 0;flex-wrap:wrap}
.tabs button{min-height:48px;border:var(--bw) solid var(--ink);border-radius:14px;background:var(--card);font-weight:900;font-size:18px;padding:6px 14px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.tabs button[aria-selected="true"]{background:var(--yellow);transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.dbody{padding:16px 20px 22px;overflow:auto;max-height:calc(92vh - 150px)}
.ibox{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:start}
.ibox .ch{width:220px;margin:20px auto 0}
.itext h3{margin:0;font-size:32px}
.itext .role{margin:4px 0 10px;font-size:18px;color:var(--body);font-weight:700}
.quote{background:var(--card);border:var(--bw) solid var(--ink);border-radius:14px;padding:10px 16px;font-size:21px;font-weight:800;box-shadow:var(--sh-sm);margin:0 0 14px}
.itext h4{margin:8px 0 4px;font-size:20px}
.rules{margin:0;padding-left:26px;font-size:19px;font-weight:700;display:flex;flex-direction:column;gap:8px}
.rules small{display:block;font-size:18px;color:var(--body);font-weight:500;font-family:ui-monospace,Menlo,monospace;line-height:1.3}
.shared{margin-top:18px;background:var(--mint);border:var(--bw) solid var(--ink);border-radius:14px;padding:12px 16px}
.shared h4{margin:0 0 6px;font-size:20px}
@media(max-width:900px){.row{grid-template-columns:1fr}.three{grid-template-columns:1fr}.scene{padding:16px;min-height:0}.scene h2{font-size:28px}.ibox{grid-template-columns:1fr}.ibox .ch{margin:0 auto}}
@media(max-width:640px){body{font-size:18px}h1{font-size:26px}header{padding:12px 14px}main{padding:12px 12px 30px}.ch{width:96px}.ch .nm{font-size:13px;padding:1px 6px}.ch:not(.big) .nm .full{display:none}.ch:not(.big) .nm .short{display:inline}.ch.big{width:170px}.ch.big .nm{font-size:16px}.ch.small{width:70px}.ch.small .nm{font-size:11px}.ch .say{font-size:13px;top:-30px}.stage{padding:36px 6px 8px;gap:6px;min-height:240px}.cap{font-size:18px;padding:8px 12px}.btn{font-size:19px;padding:8px 14px}.btn.big{min-width:0;flex:1}.cmprow{grid-template-columns:96px 1fr}.stats li b{font-size:22px}.card3 h3{font-size:28px}}
html.fast *,html.fast *::before,html.fast *::after{transition:none!important;animation:none!important}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.15s!important}}
/* ── final-pipeline additions (two active friends · retired box · history panels · model friends) ── */
.ch.answer .baton{opacity:0}
.ch.mini{width:56px}.ch.mini .nm{display:none}.ch.mini .say{font-size:18px;top:-34px;padding:2px 10px}
.stage.mini{min-height:0;padding:34px 6px 4px;gap:6px}
.retired{position:relative;display:flex;gap:2px;align-items:flex-end;border:3px dashed #868E96;border-radius:14px;padding:24px 6px 4px;margin-left:14px;opacity:.6;filter:grayscale(.75);transition:opacity .5s,filter .5s}
.retired .ch.tiny{width:70px}.retired .ch.tiny .nm{padding:1px 4px;box-shadow:2px 2px 0 var(--ink)}.retired .ch .say{top:-72px}
.retired.active{opacity:1;filter:none}
.rt.r{left:auto;right:10px}
.gap{left:auto;right:10px;transform:none}
.retired .lbl{position:absolute;top:-15px;left:10px;background:#fff;border:2px solid #868E96;border-radius:8px;padding:0 8px;font-size:18px;font-weight:900;color:#495057;white-space:nowrap}
.stamp{position:absolute;z-index:5;background:var(--coral);color:#fff;border:var(--bw) solid var(--ink);border-radius:12px;padding:4px 12px;font-size:18px;font-weight:900;box-shadow:var(--sh-sm);white-space:nowrap;transform:translate(-50%,-50%) rotate(-8deg) scale(0);transition:transform .4s cubic-bezier(.2,1.6,.4,1)}
.stamp.on{transform:translate(-50%,-50%) rotate(-8deg) scale(1)}
.rt{position:absolute;left:10px;top:8px;z-index:4;background:var(--lav);border:var(--bw) solid var(--ink);border-radius:12px;padding:4px 12px;font-weight:900;font-size:18px;white-space:nowrap;opacity:0;transition:opacity .3s;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis}
.rt.on{opacity:1}
.hist2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hpanel{background:var(--card);border:var(--bw) solid var(--ink);border-radius:18px;padding:12px 14px;box-shadow:var(--sh-sm);display:flex;flex-direction:column;gap:8px;min-width:0}
.hpanel h3{margin:0;font-size:24px;line-height:1.15}
.hpanel h3 small{font-size:18px;color:var(--body);font-weight:700;margin-left:6px}
.hpanel .kid.small{margin:0}
.stats.s4{grid-template-columns:repeat(4,auto);gap:6px}
.stats.s4 li{display:flex;flex-wrap:wrap;gap:4px;align-items:baseline;font-size:18px;padding:4px 8px}
.stats.s4 li b{display:inline;font-size:22px}
.models{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.models.col{grid-template-columns:1fr;gap:14px}
.mcard{border:var(--bw) solid var(--ink);border-radius:16px;padding:8px 12px;background:var(--surface);display:grid;grid-template-columns:84px 1fr;gap:10px;align-items:center;min-width:0}
.mcard .ch{width:84px}
.mcard h4{margin:0;font-size:22px;line-height:1.15}
.mcard h4 small{font-size:18px;color:var(--body);font-family:ui-monospace,Menlo,monospace;font-weight:700;margin-left:6px}
.mcard p{margin:3px 0 0;font-size:18px;font-weight:700;line-height:1.3}

TABS.forEach(k=>{const b=document.createElement('button');b.textContent=tabLabel(k);b.dataset.k=k;b.setAttribute('role','tab');b.onclick=()=>showTab(k);$('#tabs').appendChild(b);});
function openIntro(tab){showTab(TABS.includes(tab)?tab:'conductor');$('#intro').showModal();}
$('#introBtn').onclick=openIntro;$('#closeIntro').onclick=()=>$('#intro').close();
$('#intro').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close();});
/* ── start: #s1..#s7 opens a scene · #live plays 실전 재생 · #live-t=12 / #live-p2-t=5 seeks (paused) · #intro-models / #intro-ensemble opens a dialog tab · add "fast" for end states ── */
const hashScene=()=>{const m=location.hash.match(/s([1-9])/);return m?Math.min(SCENES.length,+m[1])-1:0;};
window.addEventListener('hashchange',()=>{if(!/live/.test(location.hash)&&hashScene()!==cur)go(hashScene(),true);});
const lm=location.hash.match(/live(?:-p(\d))?(?:-t=([\d.]+))?/);
if(lm){go(SCENES.length-1,true);if(lm[2]!=null){clearAll();liveSeek(Math.min(LIVE.list.length,Math.max(1,+(lm[1]||1)))-1,+lm[2]);}}else go(hashScene(),true);
const im=location.hash.match(/intro(?:-([a-z_]+))?/);if(im)openIntro(im[1]);
</script>
